# Release: run on every push/merge to main. release-please opens/updates the
# release PR (bumping .release-please-manifest.json and CHANGELOG.md). When
# that release PR is merged, this workflow reads the manifest version, builds
# the OTA firmware, creates a draft GitHub release, attaches the .bin, and
# then publishes the release.
#
# Drafting first means the release is never visible to on-device OTA checks
# until the firmware asset is already attached. .release-please-manifest.json
# remains the single source of truth for the version.
name: Release

on:
  push:
    branches:
      - main

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from release-please manifest
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          # github.event.head_commit.modified is empty for merge commits, so a
          # merged release-please PR never triggered the build. Instead, release
          # whenever the manifest version has no published GitHub release yet.
          # A draft release (e.g. from a failed previous publish) still counts
          # as unreleased, so the next push retries; this keeps the job
          # idempotent.
          if gh release view "v${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  # Only run release-please once the manifest version is already released
  # (version job output is empty). On the push that merges a release PR, the
  # tag doesn't exist yet, so running release-please there would open the next
  # release PR against a stale baseline with an incorrect changelog.
  release-please:
    needs: version
    if: needs.version.outputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # release-please manages the release PR and manifest/CHANGELOG via
          # release-please-config.json + .release-please-manifest.json; we
          # create and publish the actual GitHub release ourselves after the
          # .bin is built. skip-github-release is set both here and in the
          # config so whichever layer the action honors keeps it disabled.
          skip-github-release: true

  build-and-release:
    name: Build firmware and create draft release
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install esp32 core (3.3.11)
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install libraries
        run: |
          arduino-cli lib install "TFT_eSPI@2.5.43"
          arduino-cli lib install "ArduinoJson@7.4.3"

      - name: Build firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:jczn_2432s028r:PartitionScheme=custom \
            --build-property "compiler.cpp.extra_flags=-DAPP_VERSION=${{ needs.version.outputs.version }}" \
            --output-dir build/release cyd-dashboard

      - name: Create draft release and attach .bin
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          # create fails if a draft release already exists from a failed
          # previous run; in that case just attach the asset to it.
          gh release create "${TAG}" build/release/cyd-dashboard.ino.bin \
            --repo "${{ github.repository }}" \
            --draft \
            --title "${TAG}" \
            --generate-notes \
          || gh release upload "${TAG}" build/release/cyd-dashboard.ino.bin \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    needs: [version, build-and-release]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after publish so the label only flips once the release (and its .bin
  # asset) actually exists. On feature merges there is no release PR to mark.
  mark-published:
    name: Mark release-please PR as published
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark release-please PR as published
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          pr_number=$(gh pr list --repo "${{ github.repository }}" --state merged \
            --label "autorelease: pending" --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"chore(main): release ${VERSION}\") | .number")
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "${{ github.repository }}" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: published"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
