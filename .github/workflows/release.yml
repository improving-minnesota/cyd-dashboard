# Release: run on every push/merge to main. Uses release-please to determine the
# next semver version from conventional-commit PRs and, when a release is
# needed, drafts a GitHub release, builds the OTA firmware with that version
# baked into the About screen, attaches the .bin, and then publishes the draft.
#
# Flow:
#   1. A feature PR is merged to main.
#   2. release-please opens a "release-please" PR bumping the version.
#   3. Once that PR is merged, release-please creates a *draft* GitHub release.
#   4. The build job compiles with -DAPP_VERSION=<tag> and uploads the .bin as
#      a workflow artifact.
#   5. The attach job uploads the artifact to the existing draft release.
#   6. The publish job marks the draft release as published.
#
# Drafting first means the release is never visible to on-device OTA checks
# until the firmware asset is already attached.
#
# The .bin is the raw app image written to the inactive OTA slot; OTA delivery
# to the device is implemented separately (not part of this workflow yet).
name: Release

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build OTA firmware
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-firmware.yml
    with:
      app_version: ${{ needs.release-please.outputs.tag_name }}

  attach:
    name: Attach firmware to draft release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: cyd-dashboard-ota

      - name: Upload firmware to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: cyd-dashboard.ino.bin

  publish:
    name: Publish release
    needs: [release-please, attach]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: gh release edit ${{ needs.release-please.outputs.tag_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
