# Release: run on every push/merge to main. release-please opens/updates the
# release PR (bumping version.txt and CHANGELOG.md). When that release PR is
# merged, this workflow reads version.txt, builds the OTA firmware, creates a
# draft GitHub release, attaches the .bin, and then publishes the release.
#
# Drafting first means the release is never visible to on-device OTA checks
# until the firmware asset is already attached. version.txt remains the single
# source of truth for the version.
name: Release

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint release-please app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple
          # release-please manages the release PR and version files; we create
          # and publish the actual GitHub release ourselves after the .bin is built.
          skip-github-release: true

  version:
    name: Read version
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from version.txt
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat version.txt)
          # github.event.head_commit.modified is empty for merge commits, so a
          # merged release-please PR never triggered the build. Instead, release
          # whenever the version in version.txt has no GitHub release yet; this
          # is idempotent and retries automatically on the next push if a
          # previous release attempt failed.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build OTA firmware
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build-firmware.yml
    with:
      app_version: ${{ needs.version.outputs.version }}

  release:
    name: Create draft release with firmware
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: cyd-dashboard-ota

      - name: Checkout repository for gh release
        uses: actions/checkout@v4

      - name: Create draft release and attach .bin
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release create "${TAG}" cyd-dashboard.ino.bin \
            --repo "${{ github.repository }}" \
            --draft \
            --title "${TAG}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    needs: [version, release]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for gh release
        uses: actions/checkout@v4

      - name: Publish release
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
