# PR checks: lint the PR title (conventional commits, required by release-please
# in release.yml) and verify the firmware compiles. Runs on every PR to main.
name: PR - Lint & Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Lint PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            revert
            chore
            docs
            build
            ci
          requireScope: false
          subjectPattern: '^[A-Za-z].*'
          subjectPatternError: |
            The subject should begin with a letter (e.g. "feat: Add widget" or "fix: clear a bug").

  build:
    name: Build firmware
    uses: ./.github/workflows/build-firmware.yml
