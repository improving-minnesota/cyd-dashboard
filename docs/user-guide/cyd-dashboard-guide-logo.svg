<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 610" width="1350" height="610">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="boxBg28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="40%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Radar Clip to Middle Section -->
    <clipPath id="middleSectionClip28">
      <rect x="35" y="240" width="510" height="315" rx="12" />
    </clipPath>

    <!-- High-Visibility Radar Ring Gradient (crisp & opaque) -->
    <linearGradient id="ringFade28" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="scopeBackdrop28" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#0369a1" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.0" />
    </radialGradient>

    <linearGradient id="sweepPhosphor28" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>

    <!-- CYD Gold -->
    <linearGradient id="cydGold28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Titanium Silver Body -->
    <linearGradient id="titanium28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="stealthWing28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="metalNacelle28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="canopyGlass28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="afterburner28" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="glow28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="highGlow28" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b1" />
      <feGaussianBlur stdDeviation="3" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Box Canvas -->
  <rect width="1350" height="610" fill="url(#boxBg28)" rx="24" />
  
  <!-- Outer Precision Border - THICK & HIGH VISIBILITY -->
  <rect x="18" y="18" width="1314" height="574" rx="18" fill="none" stroke="#475569" stroke-width="4.0" />
  <rect x="28" y="28" width="1294" height="554" rx="14" fill="none" stroke="#facc15" stroke-width="3.0" stroke-dasharray="14 9" opacity="0.9" />

  <!-- Corner Precision Brackets -->
  <g stroke="#facc15" stroke-width="4.5" fill="none">
    <path d="M28,68 L28,28 L68,28" />
    <path d="M1322,68 L1322,28 L1282,28" />
    <path d="M28,542 L28,582 L68,582" />
    <path d="M1322,542 L1322,582 L1282,582" />
  </g>

  <!-- ======================================================== -->
  <!-- 1. PREDOMINANT TITLE & LARGER SLOGAN                     -->
  <!-- ======================================================== -->
  <g transform="translate(460.5, 135)">
    <g font-family="'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="110">
      <text x="-30" y="0" fill="#facc15" text-anchor="end">cyd</text>
      <text x="0" y="0" fill="#ffffff" text-anchor="middle">-</text>
      <text x="30" y="0" fill="#ffffff" text-anchor="start">dashboard</text>
    </g>
  </g>

  <!-- Larger Slogan spanning the horizontal area (38pt, bold) -->
  <text x="675" y="205" font-family="'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="38" fill="#38bdf8" letter-spacing="7" text-anchor="middle">
    LIVE FLIGHT TRACKER &amp; WEATHER STATION
  </text>

  <!-- Decorative Divider Bar below Title & Slogan - THICKER 3.5px -->
  <g transform="translate(675, 231)">
    <line x1="-620" y1="0" x2="-220" y2="0" stroke="#334155" stroke-width="3.5" />
    <polygon points="-210,0 -202,-5 -194,0 -202,5" fill="#facc15" />
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#facc15" stroke-width="4.0" filter="url(#glow28)" />
    <polygon points="194,0 202,-5 210,0 202,5" fill="#facc15" />
    <line x1="220" y1="0" x2="620" y2="0" stroke="#334155" stroke-width="3.5" />
  </g>

  <!-- ======================================================== -->
  <!-- 3. MIDDLE SECTION: RADAR + EMBLEM (LEFT) | BULLETS (RIGHT)-->
  <!-- ======================================================== -->

  <!-- SWEEPING RADAR SCOPE (Thicker lines & high visibility) -->
  <g id="sweepingRadarGroup" clip-path="url(#middleSectionClip28)">
    <g transform="translate(290, 398)">
      <circle cx="0" cy="0" r="215" fill="url(#scopeBackdrop28)" />

      <!-- Concentric Range Rings - THICKER (2.5px / 2.0px) -->
      <circle cx="0" cy="0" r="210" fill="none" stroke="url(#ringFade28)" stroke-width="2.6" />
      <circle cx="0" cy="0" r="155" fill="none" stroke="url(#ringFade28)" stroke-width="2.0" stroke-dasharray="9 6" />
      <circle cx="0" cy="0" r="102" fill="none" stroke="url(#ringFade28)" stroke-width="2.0" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#ringFade28)" stroke-width="1.8" stroke-dasharray="5 4" />

      <!-- Cardinal Crosshairs & Azimuth Rays - THICKER -->
      <line x1="-210" y1="0" x2="210" y2="0" stroke="url(#ringFade28)" stroke-width="1.8" stroke-dasharray="6 6" />
      <line x1="0" y1="-210" x2="0" y2="135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.45" />
      <line x1="-145" y1="-145" x2="145" y2="145" stroke="url(#ringFade28)" stroke-width="1.2" stroke-dasharray="4 6" />
      <line x1="-145" y1="145" x2="145" y2="-145" stroke="url(#ringFade28)" stroke-width="1.2" stroke-dasharray="4 6" />

      <!-- Range Distance Ticks on Crosshairs -->
      <g stroke="#38bdf8" stroke-width="1.8" opacity="0.6">
        <line x1="-50" y1="-5" x2="-50" y2="5" />
        <line x1="-102" y1="-7" x2="-102" y2="7" />
        <line x1="-155" y1="-5" x2="-155" y2="5" />
        <line x1="50" y1="-5" x2="50" y2="5" />
        <line x1="102" y1="-7" x2="102" y2="7" />
        <line x1="155" y1="-5" x2="155" y2="5" />
      </g>

      <!-- Radar Sweeping Beam Sector -->
      <path d="M0,0 L-145,125 A195,195 0 0,1 -192,30 Z" fill="url(#sweepPhosphor28)" />
      <line x1="0" y1="0" x2="-192" y2="30" stroke="#67e8f9" stroke-width="2.8" filter="url(#glow28)" />

      <!-- Radar Aircraft Targets / Blips -->
      <circle cx="88" cy="-105" r="4.5" fill="#facc15" filter="url(#glow28)" />
      <circle cx="88" cy="-105" r="9" fill="none" stroke="#facc15" stroke-width="1.2" opacity="0.75" />
      <line x1="88" y1="-105" x2="104" y2="-119" stroke="#facc15" stroke-width="1.8" opacity="0.9" />
      
      <circle cx="-105" cy="-68" r="4" fill="#38bdf8" filter="url(#glow28)" />
      <line x1="-105" y1="-68" x2="-122" y2="-61" stroke="#38bdf8" stroke-width="1.6" opacity="0.85" />
      
      <circle cx="-155" cy="48" r="5" fill="#22d3ee" filter="url(#glow28)" />
      <circle cx="-155" cy="48" r="10" fill="none" stroke="#22d3ee" stroke-width="1.4" opacity="0.85" />
      <line x1="-155" y1="48" x2="-175" y2="41" stroke="#22d3ee" stroke-width="1.8" />
    </g>
  </g>

  <!-- PLANE-BIRD HERO EMBLEM (Slightly more compact scale 0.34, ample clearance) -->
  <g id="heroEmblem" transform="translate(290, 398) scale(0.34)">
    <g filter="url(#highGlow28)">
      <polygon points="-75,150 -52,150 -63,280" fill="url(#afterburner28)" />
      <polygon points="-70,150 -56,150 -63,215" fill="#ffffff" />
      <polygon points="52,150 75,150 63,280" fill="url(#afterburner28)" />
      <polygon points="56,150 70,150 63,215" fill="#ffffff" />
    </g>

    <g stroke="#090d16" stroke-width="1.8">
      <path d="M0,105 L-125,210 L-78,225 L0,122 Z" fill="#1e293b" />
      <path d="M0,112 L-72,238 L-30,252 L0,130 Z" fill="#334155" />
      <path d="M0,120 L-20,265 L20,265 L0,120 Z" fill="#475569" />
      <path d="M0,112 L72,238 L30,252 L0,130 Z" fill="#334155" />
      <path d="M0,105 L125,210 L78,225 L0,122 Z" fill="#1e293b" />
      <line x1="0" y1="120" x2="0" y2="265" stroke="#facc15" stroke-width="2.5" />
    </g>

    <polygon points="-75,95 -112,12 -82,12 -54,118" fill="url(#metalNacelle28)" stroke="#1e293b" stroke-width="1.8" />
    <polygon points="-112,12 -82,12 -86,32 -108,32" fill="#facc15" />
    <polygon points="75,95 112,12 82,12 54,118" fill="url(#metalNacelle28)" stroke="#1e293b" stroke-width="1.8" />
    <polygon points="112,12 82,12 86,32 108,32" fill="#facc15" />

    <g id="leftWing">
      <path d="M0,-110 L-145,-65 L-380,60 C-370,90 -350,112 -315,125 C-300,105 -275,120 -250,132 C-230,120 -210,130 -185,140 L-55,145 L0,70 Z" fill="url(#stealthWing28)" stroke="#1e293b" stroke-width="2" />
      <path d="M-145,-65 L-380,60 Q-335,100 -300,115 L-135,10 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
      <path d="M0,-110 L-145,-65 L-380,60" stroke="#facc15" stroke-width="4.5" fill="none" filter="url(#glow28)" />
      <circle cx="-380" cy="60" r="7" fill="#ef4444" filter="url(#glow28)" />
      <circle cx="-380" cy="60" r="3" fill="#ffffff" />
      <path d="M-82,80 C-94,80 -102,95 -102,120 C-102,145 -94,158 -82,158 L-54,158 C-42,158 -42,80 -54,80 Z" fill="url(#metalNacelle28)" stroke="#1e293b" stroke-width="1.8" />
      <ellipse cx="-68" cy="82" rx="16" ry="6.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.8" filter="url(#glow28)" />
    </g>

    <g id="rightWing">
      <path d="M0,-110 L145,-65 L380,60 C370,90 350,112 315,125 C300,105 275,120 250,132 C230,120 210,130 185,140 L55,145 L0,70 Z" fill="url(#stealthWing28)" stroke="#1e293b" stroke-width="2" />
      <path d="M145,-65 L380,60 Q335,100 300,115 L135,10 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
      <path d="M0,-110 L145,-65 L380,60" stroke="#facc15" stroke-width="4.5" fill="none" filter="url(#glow28)" />
      <circle cx="380" cy="60" r="7" fill="#10b981" filter="url(#glow28)" />
      <circle cx="380" cy="60" r="3" fill="#ffffff" />
      <path d="M82,80 C94,80 102,95 102,120 C102,145 94,158 82,158 L54,158 C42,158 42,80 54,80 Z" fill="url(#metalNacelle28)" stroke="#1e293b" stroke-width="1.8" />
      <ellipse cx="68" cy="82" rx="16" ry="6.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.8" filter="url(#glow28)" />
    </g>

    <path d="M0,-210 C32,-175 60,-105 60,-10 C60,70 45,120 0,142 C-45,120 -60,70 -60,-10 C-60,-105 -32,-175 0,-210 Z" fill="url(#titanium28)" stroke="#1e293b" stroke-width="2.5" />
    <polygon points="0,-210 40,-105 36,70 0,135 -36,70 -40,-105" fill="#f8fafc" />
    <polygon points="0,15 18,38 14,44 0,33 -14,44 -18,38" fill="#facc15" />
    <polygon points="0,48 18,71 14,77 0,66 -14,77 -18,71" fill="#facc15" />
    <polygon points="0,81 18,104 14,110 0,99 -14,110 -18,104" fill="#facc15" />
    <path d="M0,-180 C18,-155 22,-105 15,-70 C8,-55 0,-50 0,-50 C0,-50 -8,-55 -15,-70 C-22,-105 -18,-155 0,-180 Z" fill="url(#canopyGlass28)" stroke="#38bdf8" stroke-width="2" filter="url(#glow28)" />
    <circle cx="-24" cy="-125" r="4" fill="#38bdf8" />
    <circle cx="24" cy="-125" r="4" fill="#38bdf8" />
    
    <path d="M0,-242 C14,-225 18,-198 14,-175 C8,-165 0,-162 0,-162 C0,-162 -8,-165 -14,-175 C-18,-198 -14,-225 0,-242 Z" fill="url(#cydGold28)" stroke="#a16207" stroke-width="1.8" />
    <line x1="0" y1="-242" x2="0" y2="-162" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-242" x2="0" y2="-275" stroke="#f8fafc" stroke-width="2.5" />
    <circle cx="0" cy="-288" r="2.2" fill="#ffffff" />
  </g>

  <!-- Clean Vertical Divider Line - THICKER 3.5px -->
  <line x1="545" y1="255" x2="545" y2="545" stroke="#334155" stroke-width="3.5" />

  <!-- RIGHT: 5 MUCH LARGER BOLD FEATURE BULLETS (40pt!) -->
  <g id="bulletList" transform="translate(575, 0)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="40" fill="#f8fafc">
    <g transform="translate(0, 287)">
      <circle cx="16" cy="-12" r="8" fill="#38bdf8" />
      <text x="44" y="0">Live ADS-B Flight Radar</text>
    </g>

    <g transform="translate(0, 347)">
      <circle cx="16" cy="-12" r="8" fill="#facc15" />
      <text x="44" y="0">Live Weather &amp; Forecasts</text>
    </g>

    <g transform="translate(0, 407)">
      <circle cx="16" cy="-12" r="8" fill="#06b6d4" />
      <text x="44" y="0">Pool Temperature Monitoring</text>
    </g>

    <g transform="translate(0, 467)">
      <circle cx="16" cy="-12" r="8" fill="#a855f7" />
      <text x="44" y="0">50 Alarms &amp; Melody Presets</text>
    </g>

    <g transform="translate(0, 527)">
      <circle cx="16" cy="-12" r="8" fill="#10b981" />
      <text x="44" y="0">Standalone WiFi · Auto-OTA</text>
    </g>
  </g>

</svg>